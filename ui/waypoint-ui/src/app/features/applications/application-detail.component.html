<main class="page"><nav><a routerLink="/applications">← Applications</a></nav><p class="error">{{error}}</p><section *ngIf="application as a"><header><div><p>{{a.currentStage}}</p><h1>{{a.position}}</h1><p>{{a.companyName}}</p></div><a *ngIf="a.jobUrl" [href]="a.jobUrl" target="_blank">Open job posting</a></header><section class="cards"><article><div><h2>Application details</h2><p>{{a.location||'No location'}} · {{a.workMode||'No work mode'}}</p><p>Applied {{a.dateApplied}}</p><p>{{a.notes||'No notes yet.'}}</p></div></article><article><div><h2>Move application forward</h2><select [(ngModel)]="newStage"><option>OA</option><option>INTERVIEW</option><option>OFFER</option><option>REJECTED</option><option>WITHDRAWN</option><option>GHOSTED</option></select><input *ngIf="newStage==='OA'||newStage==='INTERVIEW'" type="date" [(ngModel)]="reminderDate"><textarea [(ngModel)]="notes" placeholder="Stage notes"></textarea><button [disabled]="saving" (click)="change()">{{saving?'Saving…':'Change stage'}}</button></div></article></section></section></main>
