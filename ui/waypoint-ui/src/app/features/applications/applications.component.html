<main class="page"><nav><a routerLink="/">Overview</a><a routerLink="/applications" class="active">Applications</a><a routerLink="/companies">Companies</a><a routerLink="/contacts">Contacts</a><a routerLink="/reminders">Reminders</a><a routerLink="/resumes">Resumes</a></nav><header><div><p>Opportunity pipeline</p><h1>Applications</h1></div><button (click)="form=!form">＋ Add application</button></header><section class="form" *ngIf="form"><select [(ngModel)]="draft.companyId"><option value="">Select company</option><option *ngFor="let c of companies" [value]="c.id">{{c.name}}</option></select><input [(ngModel)]="draft.position" placeholder="Position"><input [(ngModel)]="draft.location" placeholder="Location"><select [(ngModel)]="draft.workMode"><option [ngValue]="undefined">Work mode</option><option>REMOTE</option><option>HYBRID</option><option>ONSITE</option></select><input type="date" [(ngModel)]="draft.dateApplied"><input [(ngModel)]="draft.jobUrl" placeholder="Job URL"><textarea [(ngModel)]="draft.notes" placeholder="Notes"></textarea><button (click)="add()">Save</button></section><p class="error">{{error}}</p><div class="tools"><input [(ngModel)]="search" placeholder="Search roles or companies"><select [(ngModel)]="stage"><option value="">All stages</option><option *ngFor="let s of ['APPLIED','OA','INTERVIEW','OFFER','REJECTED','WITHDRAWN','GHOSTED']">{{s}}</option></select></div><p *ngIf="loading">Loading…</p><section class="cards"><article *ngFor="let a of filtered"><div><span class="stage">{{stageLabel(a.currentStage)}}</span><h2><a [routerLink]="['/applications',a.id]">{{a.position}}</a></h2><p>{{a.companyName}} · {{a.location||'Location not set'}} · {{a.workMode||'Mode not set'}}</p><small>Applied {{a.dateApplied}}</small></div><button class="danger" (click)="remove(a)">Delete</button></article></section></main>
