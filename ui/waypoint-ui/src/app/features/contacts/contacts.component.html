<main class="page"><nav><a routerLink="/">Overview</a><a routerLink="/applications">Applications</a><a routerLink="/companies">Companies</a><a class="active">Contacts</a><a routerLink="/reminders">Reminders</a><a routerLink="/resumes">Resumes</a></nav><header><div><p>Your network</p><h1>Contacts</h1></div></header><div class="tools"><select [(ngModel)]="companyId" (change)="load()"><option *ngFor="let c of companies" [value]="c.id">{{c.name}}</option></select></div><section class="form"><input [(ngModel)]="draft.name" placeholder="Contact name"><select [(ngModel)]="draft.role"><option>RECRUITER</option><option>HIRING_MANAGER</option><option>REFERRAL</option><option>FOUNDER</option><option>OTHER</option></select><input [(ngModel)]="draft.email" placeholder="Email"><input [(ngModel)]="draft.linkedinUrl" placeholder="LinkedIn URL"><textarea [(ngModel)]="draft.notes" placeholder="Notes"></textarea><button (click)="add()">Add contact</button></section><p class="error">{{error}}</p><section class="cards"><article *ngFor="let c of contacts"><div><span class="stage">{{c.role}}</span><h2>{{c.name}}</h2><p>{{c.companyName}}</p><a *ngIf="c.email" [href]="'mailto:'+c.email">{{c.email}}</a> · <a *ngIf="c.linkedinUrl" [href]="c.linkedinUrl" target="_blank">LinkedIn</a></div><button class="danger" (click)="remove(c)">Delete</button></article></section></main>
